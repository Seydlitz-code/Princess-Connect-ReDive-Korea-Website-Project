# Railway 는 master 브랜치를 배포한다. 작업은 브랜치에서 하고, 이 CI 가 통과한 뒤 master 로 병합한다.
name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-check:
    name: master 병합 충돌 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: origin/master 와 병합 시도
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch --no-tags origin master
          echo "master 보다 앞선 커밋: $(git rev-list --count origin/master..HEAD), 뒤처진 커밋: $(git rev-list --count HEAD..origin/master)"
          if git merge --no-commit --no-ff origin/master; then
            echo "충돌 없음: master 에 병합 가능합니다."
          else
            echo "::error::master 와 충돌하는 파일이 있습니다. 브랜치에서 master 를 병합(또는 rebase)해 해결하세요."
            git diff --name-only --diff-filter=U | sed 's/^/  - /'
            exit 1
          fi

  unit:
    name: 문법·단위 테스트·의존성 감사 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: 문법 검사(모든 JS)
        run: git ls-files '*.js' '*.cjs' '*.mjs' | xargs -n1 node --check
      - name: 단위 테스트
        run: npm test
      - name: 운영 의존성 취약점 감사(high 이상 실패)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (PostgreSQL + Chromium)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: priconne
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/priconne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chromium 설치
        run: npx playwright-core install --with-deps chromium
      - name: E2E 실행
        run: npm run test:e2e

  docker:
    name: Docker 이미지 빌드·기동 확인
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: priconne
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t priconne-site:ci .
      - name: 컨테이너 기동 후 health 확인
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/priconne \
            -e SESSION_SECRET=ci-session-secret \
            priconne-site:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health | grep -q '"poolReady":true'; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health | grep -q '"poolReady":true'
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          test "$(curl -fsS http://127.0.0.1:8080/api/characters | node -pe 'JSON.parse(require("fs").readFileSync(0)).characters.length')" -gt 300
          echo "컨테이너 정상 기동(Node $(docker exec app node -v), 사용자 $(docker exec app whoami))"
      - name: 실패 시 컨테이너 로그
        if: failure()
        run: docker logs app || true
