# 작업은 브랜치에서 하고, 이 CI가 통과한 뒤 master로 병합한다.
# 배포는 CI가 아니라 `npm run deploy`(wrangler)로 직접 한다 (README.md 참고).
name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-check:
    name: master 병합 충돌 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: origin/master 와 병합 시도
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch --no-tags origin master
          echo "master 보다 앞선 커밋: $(git rev-list --count origin/master..HEAD), 뒤처진 커밋: $(git rev-list --count HEAD..origin/master)"
          if git merge --no-commit --no-ff origin/master; then
            echo "충돌 없음: master 에 병합 가능합니다."
          else
            echo "::error::master 와 충돌하는 파일이 있습니다. 브랜치에서 master 를 병합(또는 rebase)해 해결하세요."
            git diff --name-only --diff-filter=U | sed 's/^/  - /'
            exit 1
          fi

  test:
    name: 문법·타입·단위·통합 테스트 (wrangler dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 문법 검사(브라우저·Node 스크립트)
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위·통합 테스트
        run: npm test
      - name: 배포 묶음 만들기 확인(업로드 없음)
        run: npx wrangler deploy --dry-run --outdir dist
      - name: 운영 의존성 취약점 감사(high 이상 실패)
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: 브라우저 E2E (wrangler dev + Chromium)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Chromium 설치
        run: npx playwright-core install --with-deps chromium
      - name: 브라우저 E2E 실행
        run: npm run test:browser
