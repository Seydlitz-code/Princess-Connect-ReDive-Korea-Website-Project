<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공주 연결! Re:Dive — 한국 서버 공략</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/images/logo.png" type="image/png" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="brand" aria-label="메인으로">
          <img
            class="brand-logo-img"
            src="/images/logo.png"
            width="97"
            height="58"
            alt="프린세스 커넥트! Re:Dive"
            decoding="async"
          />
        </a>

        <nav class="site-nav" aria-label="게시판">
          <div class="nav-track">
            <button type="button" class="nav-link is-active" data-board="main">
              <span class="nav-ko">메인</span>
              <span class="nav-ja">メイン</span>
            </button>
            <button type="button" class="nav-link" data-board="clan">
              <span class="nav-ko">클랜전</span>
              <span class="nav-ja">クランバトル</span>
            </button>
            <button type="button" class="nav-link" data-board="stadium">
              <span class="nav-ko">배틀 스타디움</span>
              <span class="nav-ja">バトルスタジアム</span>
            </button>
            <button type="button" class="nav-link" data-board="deep">
              <span class="nav-ko">심역 퀘스트</span>
              <span class="nav-ja">深域クエスト</span>
            </button>
            <button type="button" class="nav-link" data-board="abyss">
              <span class="nav-ko">심역 토벌전</span>
              <span class="nav-ja">深淵討伐戦</span>
            </button>
            <span class="nav-underline" aria-hidden="true"></span>
          </div>
        </nav>

        <div class="header-actions" id="header-actions-guest">
          <button type="button" class="btn btn-signup" id="open-signup">회원가입</button>
          <button type="button" class="btn btn-primary btn-login" id="open-login">로그인</button>
        </div>
        <div class="header-actions header-actions-logged" id="header-actions-logged" hidden>
          <div class="user-bar" aria-label="로그인한 계정">
            <div class="user-avatar-wrap">
              <img id="header-user-avatar" class="user-avatar-img" alt="" width="42" height="42" decoding="async" hidden />
              <span id="header-user-avatar-ph" class="user-avatar-placeholder">프로필 이미지</span>
            </div>
            <span id="header-user-nickname" class="user-nickname">—</span>
            <button type="button" class="btn btn-signup btn-logout-header" id="header-logout">로그아웃</button>
          </div>
        </div>
      </div>
    </header>

    <main class="site-main" id="main-content">
      <section class="board-panel is-visible" data-board-panel="main" aria-label="메인 게시판"></section>
      <section class="board-panel" data-board-panel="clan" hidden aria-label="클랜전 게시판"></section>
      <section class="board-panel" data-board-panel="stadium" hidden aria-label="배틀 스타디움 게시판"></section>
      <section class="board-panel" data-board-panel="deep" hidden aria-label="심역 퀘스트 게시판"></section>
      <section class="board-panel" data-board-panel="abyss" hidden aria-label="심역 토벌전 게시판"></section>
    </main>

    <div class="modal-root" id="signup-modal" role="dialog" aria-modal="true" aria-labelledby="signup-heading" hidden>
      <div class="modal-backdrop" data-close-modal tabindex="-1"></div>
      <div class="modal-sheet signup-modal-sheet" role="document">
        <button type="button" class="modal-back link-back" id="signup-modal-back">
          <span aria-hidden="true">←</span> 뒤로 가기
        </button>
        <div id="signup-head-account">
          <header class="modal-head">
            <h2 id="signup-heading" class="modal-title">회원가입</h2>
            <p class="modal-sub">새 계정을 만들어서 댓글을 남겨보세요.</p>
          </header>
        </div>
        <div id="signup-head-characters" class="signup-head-characters" hidden>
          <header class="modal-head">
            <h2 id="signup-heading-characters" class="modal-title">보유 캐릭터 선택</h2>
            <p class="modal-sub">
              보유 캐릭터 데이터베이스는 추천 파티 제공에 사용됩니다. 회원가입 후에도 변경할 수 있습니다.
            </p>
          </header>
        </div>

        <div id="signup-step-account">
          <div class="signup-grid">
            <div class="signup-col signup-col--left">
              <div class="profile-block">
                <div class="profile-preview-wrap">
                  <div class="profile-preview" id="profile-preview">
                    <span class="profile-placeholder-text">프로필</span>
                  </div>
                </div>
                <div class="profile-controls">
                  <label class="profile-label" for="profile-file">프로필 이미지 설정</label>
                  <input type="file" id="profile-file" accept="image/*" hidden />
                  <button type="button" class="btn btn-outline btn-sm" id="profile-file-trigger">이미지 선택</button>
                </div>
              </div>

              <div class="field-group">
                <label class="field-label" for="nickname">닉네임</label>
                <div class="field-row">
                  <input id="nickname" type="text" class="input" placeholder="닉네임을 입력하세요" autocomplete="nickname" />
                  <button type="button" class="btn btn-secondary btn-compact" id="check-nickname">중복 확인</button>
                </div>
                <p id="nickname-check-feedback" class="field-check-feedback" role="status" aria-live="polite"></p>
                <p class="field-hint">닉네임은 2~32자, 중복되지 않아야 합니다.</p>
              </div>
            </div>

            <div class="signup-col signup-col--right">
              <div class="field-group">
                <label class="field-label" for="userid">아이디</label>
                <div class="field-row">
                  <input id="userid" type="text" class="input" placeholder="아이디" autocomplete="username" />
                  <button type="button" class="btn btn-secondary btn-compact" id="check-userid">중복 확인</button>
                </div>
                <p id="userid-check-feedback" class="field-check-feedback" role="status" aria-live="polite"></p>
              </div>

              <div class="field-group">
                <label class="field-label" for="password">비밀번호</label>
                <input id="password" type="password" class="input" placeholder="비밀번호" autocomplete="new-password" />
              </div>

              <div class="field-group">
                <label class="field-label" for="password2">비밀번호 확인</label>
                <input id="password2" type="password" class="input" placeholder="비밀번호 재입력" autocomplete="new-password" />
              </div>

              <div class="field-group">
                <label class="field-label" for="captcha-input">보안 문자</label>
                <div class="captcha-row">
                  <div class="captcha-box" aria-hidden="true">
                    <span class="captcha-fake">A8K4</span>
                  </div>
                  <input id="captcha-input" type="text" class="input captcha-input" placeholder="보안 문자 입력" autocomplete="off" />
                </div>
                <p class="field-hint">실제 검증은 다음 단계에서 연결할 수 있습니다.</p>
              </div>
            </div>
          </div>
        </div>

        <div id="signup-step-characters" class="signup-step-characters" hidden>
          <div class="character-grid-scroll" tabindex="0">
            <div id="character-grid" class="character-grid" role="list" aria-label="보유 캐릭터 목록"></div>
          </div>
          <p id="character-load-error" class="field-hint signup-error" hidden></p>
        </div>

        <footer class="modal-footer">
          <div id="signup-footer-account" class="signup-footer-panel">
            <button type="button" class="btn btn-primary btn-lg btn-footer-primary" id="signup-next" disabled>다음으로</button>
          </div>
          <div id="signup-footer-characters" class="signup-footer-panel signup-footer-characters" hidden>
            <label class="defer-label">
              <input type="checkbox" id="defer-characters-later" />
              <span>보유 캐릭터 추후 등록</span>
            </label>
            <button type="button" class="btn btn-primary btn-lg btn-footer-primary" id="signup-submit">회원가입</button>
          </div>
        </footer>
      </div>
    </div>

    <div class="modal-root" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-heading" hidden>
      <div class="modal-backdrop" data-close-login-modal tabindex="-1"></div>
      <div class="modal-sheet modal-sheet--narrow" role="document">
        <button type="button" class="modal-back link-back" id="login-modal-close">
          <span aria-hidden="true">←</span> 뒤로 가기
        </button>
        <header class="modal-head">
          <h2 id="login-heading" class="modal-title">로그인</h2>
          <p class="modal-sub">아이디와 비밀번호를 입력하세요.</p>
        </header>
        <form id="login-form" class="login-form">
          <div class="field-group">
            <label class="field-label" for="login-username">아이디</label>
            <input
              id="login-username"
              name="username"
              type="text"
              class="input"
              placeholder="아이디"
              autocomplete="username"
              required
              minlength="3"
              maxlength="32"
            />
          </div>
          <div class="field-group">
            <label class="field-label" for="login-password">비밀번호</label>
            <input
              id="login-password"
              name="password"
              type="password"
              class="input"
              placeholder="비밀번호"
              autocomplete="current-password"
              required
              minlength="1"
              maxlength="72"
            />
          </div>
          <p id="login-form-error" class="field-check-feedback is-warn login-form-error" role="alert" aria-live="assertive" hidden></p>
          <footer class="modal-footer login-modal-footer">
            <button type="submit" class="btn btn-primary btn-lg btn-login-submit" id="login-submit-btn">로그인</button>
          </footer>
        </form>
      </div>
    </div>

    <script src="/js/main.js" defer></script>
  </body>
</html>
